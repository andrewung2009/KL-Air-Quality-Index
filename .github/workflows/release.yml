name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Release notes with checksum
        shell: pwsh
        run: |
          $exe = "dist/KL-AQI.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          $downloadLine = '1. Download `KL-AQI.exe` (~' + $mb + ' MB).'
          $shaLine = '- SHA-256: `' + $sha + '`'
          $lines = @(
            '**KL AQI** - an always-on-top Windows widget showing the live Kuala Lumpur US AQI (IQAir, no API key).',
            '',
            '### Download and run',
            $downloadLine,
            '2. Double-click it - that''s it. The widget opens right away; the first run also installs to `%LOCALAPPDATA%\KL AQI` and creates **Desktop** and **auto-start** shortcuts (no admin rights needed).',
            '3. **Updating**: just run the new `KL-AQI.exe` - it stops the running copy and replaces the installed files in place.',
            '',
            '### Details',
            '- Windows 10/11 x64',
            '- Hotkeys: `Ctrl+Alt+H` show/hide - `Ctrl+Alt+A` click-through - `Ctrl+Alt+R` refresh',
            '- Runtime state and logs live in `%APPDATA%\aqi-overlay`',
            '- Unsigned build - if SmartScreen appears choose *More info > run anyway*',
            $shaLine,
            '',
            '[Source code](https://github.com/andrewung2009/KL-Air-Quality-Index)'
          )
          Set-Content -Path dist/RELEASE_BODY.md -Value ($lines -join "`n") -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KL-AQI.exe
          name: KL AQI ${{ github.ref_name }} - Windows x64
          body_path: dist/RELEASE_BODY.md
